<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elsewhere</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

<script>
const ROOM2_YAW = 0;

/* ================================
   走路起伏
================================ */
AFRAME.registerComponent('head-bob', {
    init() {
        this.time = 0;
        this.offset = 0;
        this.keys = {};

        window.addEventListener('keydown', e => {
            this.keys[e.code] = true;
        });

        window.addEventListener('keyup', e => {
            this.keys[e.code] = false;
        });
    },

    tick(time, delta) {
        const moving =
            this.keys.KeyW ||
            this.keys.KeyA ||
            this.keys.KeyS ||
            this.keys.KeyD;

        this.el.object3D.position.y -= this.offset;

        if (moving) {
            this.time += delta / 1000;
            this.offset = Math.sin(this.time * 10) * 0.04;
        } else {
            this.offset *= 0.8;
        }

        this.el.object3D.position.y += this.offset;
    }
});

/* ================================
   进入Room2
   手电闪烁 + 眼睛出现水波纹
================================ */
AFRAME.registerComponent('room2-flicker', {
    init() {
        this.room2 = document.querySelector('#room2');
        this.flashlight = document.querySelector('#flashlight');
        this.eyeRipple = document.querySelector('#eyeRipple');

        this.started = false;
        this.active = false;

        this.startTime = 0;
        this.duration = 5000;

        this.lastFlicker = 0;
        this.nextFlickerDelay = 80;
    },

    tick(time) {
        if (!this.room2 || !this.flashlight) return;

        if (
            !this.started &&
            this.room2.getAttribute('visible')
        ) {
            this.started = true;
            this.active = true;
            this.startTime = time;

            if (this.eyeRipple) {
                this.eyeRipple.setAttribute('visible', true);
            }
        }

        if (!this.active) return;

        const elapsed = time - this.startTime;

        if (elapsed >= this.duration) {
            this.active = false;

            const light =
                this.flashlight.getObject3D('light');

            if (light) {
                light.intensity = 3;
            }

            this.flashlight.setAttribute(
                'light',
                'intensity',
                3
            );

            return;
        }

        if (
            time - this.lastFlicker >=
            this.nextFlickerDelay
        ) {
            this.lastFlicker = time;

            const random = Math.random();
            let intensity;

            if (random < 0.25) {
                intensity = 0;
            } else if (random < 0.50) {
                intensity =
                    0.1 +
                    Math.random() * 0.3;
            } else if (random < 0.70) {
                intensity =
                    0.7 +
                    Math.random() * 0.8;
            } else {
                intensity =
                    2.5 +
                    Math.random() * 0.5;
            }

            const light =
                this.flashlight.getObject3D('light');

            if (light) {
                light.intensity = intensity;
            }

            this.flashlight.setAttribute(
                'light',
                'intensity',
                intensity
            );

            this.nextFlickerDelay =
                50 +
                Math.random() * 150;
        }
    }
});

/* ================================
   Room2眼睛水波纹
================================ */
AFRAME.registerComponent('eye-ripple', {
    init() {
        this.ring1 =
            this.el.querySelector('#eyeRipple1');

        this.ring2 =
            this.el.querySelector('#eyeRipple2');

        this.ring3 =
            this.el.querySelector('#eyeRipple3');
    },

    tick(time) {
        if (!this.el.getAttribute('visible')) return;

        this.animateRing(
            this.ring1,
            time,
            0
        );

        this.animateRing(
            this.ring2,
            time,
            500
        );

        this.animateRing(
            this.ring3,
            time,
            1000
        );
    },

    animateRing(ring, time, delay) {
        if (!ring) return;

        const duration = 1600;

        const cycle =
            ((time - delay) % duration + duration) %
            duration;

        const progress =
            cycle / duration;

        const scale =
            0.35 +
            progress * 1.4;

        const opacity =
            (1 - progress) * 0.8;

        ring.object3D.scale.set(
            scale,
            scale,
            scale
        );

        const material =
            ring.getObject3D('mesh')?.material;

        if (material) {
            material.opacity = opacity;
            material.transparent = true;
        }
    }
});

/* ================================
   Room2点击5次
   → 黑屏
   → 返回Hallway
================================ */
AFRAME.registerComponent('eye-click-return', {
    init() {
        this.clickCount = 0;
        this.requiredClicks = 5;
        this.finished = false;

        this.room2 =
            document.querySelector('#room2');

        this.hallway =
            document.querySelector('#hallway');

        this.player =
            document.querySelector('#player');

        this.camera =
            document.querySelector('#camera');

        this.eyeRipple =
            document.querySelector('#eyeRipple');

        this.blackScreen =
            document.querySelector('#blackScreen');

        window.addEventListener('mousedown', e => {
            if (e.button !== 0) return;

            this.handleClick();
        });
    },

    handleClick() {
        if (this.finished) return;

        /* 必须已经进入Room2 */
        if (
            !this.room2 ||
            !this.room2.getAttribute('visible')
        ) {
            return;
        }

        /* 必须等水波纹出现 */
        if (
            !this.eyeRipple ||
            !this.eyeRipple.getAttribute('visible')
        ) {
            return;
        }

        this.clickCount++;

        console.log(
            'Room2 click:',
            this.clickCount
        );

        /* 点击反馈 */
        this.eyeRipple.object3D.scale.set(
            1.25,
            1.25,
            1.25
        );

        setTimeout(() => {
            if (this.eyeRipple) {
                this.eyeRipple.object3D.scale.set(
                    1,
                    1,
                    1
                );
            }
        }, 80);

        if (
            this.clickCount >=
            this.requiredClicks
        ) {
            this.finished = true;
            this.startBlackout();
        }
    },

    startBlackout() {
        console.log('BLACKOUT START');

        if (this.eyeRipple) {
            this.eyeRipple.setAttribute(
                'visible',
                false
            );
        }

        if (this.blackScreen) {
            this.blackScreen.setAttribute(
                'visible',
                true
            );

            this.blackScreen.object3D.traverse(obj => {
                obj.renderOrder = 99999;

                if (obj.material) {
                    obj.material.depthTest = false;
                    obj.material.depthWrite = false;
                }
            });
        }

        setTimeout(() => {
            this.returnToHallway();
        }, 3000);
    },

    returnToHallway() {
        console.log('RETURN TO HALLWAY');

        this.room2.setAttribute(
            'visible',
            false
        );

        this.hallway.setAttribute(
            'visible',
            true
        );

        this.player.object3D.position.set(
            1,
            -1.5,
            5
        );

        this.camera.object3D.position.set(
            0,
            1.6,
            0
        );

        const lookControls =
            this.camera.components['look-controls'];

        if (lookControls) {
            lookControls.yawObject.rotation.y = 0;
            lookControls.pitchObject.rotation.x = 0;
        }

        this.player.object3D.updateMatrixWorld(true);
        this.camera.object3D.updateMatrixWorld(true);

        setTimeout(() => {
            if (this.blackScreen) {
                this.blackScreen.setAttribute(
                    'visible',
                    false
                );
            }
        }, 500);
    }
});

/* ================================
   脚步声
================================ */
AFRAME.registerComponent('footsteps', {
    init() {
        this.keys = {};
        this.stepTimer = 0;
        this.stepInterval = 0.58;
        this.audioContext = null;

        window.addEventListener('keydown', e => {
            if (
                ![
                    'KeyW',
                    'KeyA',
                    'KeyS',
                    'KeyD'
                ].includes(e.code)
            ) {
                return;
            }

            this.keys[e.code] = true;

            if (!this.audioContext) {
                this.audioContext = new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
            }

            if (
                this.audioContext.state ===
                'suspended'
            ) {
                this.audioContext.resume();
            }
        });

        window.addEventListener('keyup', e => {
            if (
                [
                    'KeyW',
                    'KeyA',
                    'KeyS',
                    'KeyD'
                ].includes(e.code)
            ) {
                this.keys[e.code] = false;
            }
        });
    },

    playStep() {
        if (!this.audioContext) return;

        const ctx = this.audioContext;
        const now = ctx.currentTime;
        const duration = 0.18;

        const bufferSize =
            Math.floor(
                ctx.sampleRate *
                duration
            );

        const buffer =
            ctx.createBuffer(
                1,
                bufferSize,
                ctx.sampleRate
            );

        const data =
            buffer.getChannelData(0);

        for (
            let i = 0;
            i < bufferSize;
            i++
        ) {
            const fade =
                Math.pow(
                    1 - i / bufferSize,
                    3
                );

            data[i] =
                (Math.random() * 2 - 1) *
                fade;
        }

        const source =
            ctx.createBufferSource();

        const lowpass =
            ctx.createBiquadFilter();

        const bass =
            ctx.createBiquadFilter();

        const lowShelf =
            ctx.createBiquadFilter();

        const gain =
            ctx.createGain();

        source.buffer = buffer;

        lowpass.type = 'lowpass';

        lowpass.frequency.value =
            260 +
            Math.random() * 90;

        lowpass.Q.value = 0.8;

        bass.type = 'peaking';

        bass.frequency.value =
            90 +
            Math.random() * 20;

        bass.Q.value = 1.2;
        bass.gain.value = 11;

        lowShelf.type = 'lowshelf';
        lowShelf.frequency.value = 180;
        lowShelf.gain.value = 8;

        const volume =
            0.65 +
            Math.random() * 0.025;

        gain.gain.setValueAtTime(
            0.001,
            now
        );

        gain.gain.linearRampToValueAtTime(
            volume,
            now + 0.012
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + duration
        );

        source.connect(lowpass);
        lowpass.connect(bass);
        bass.connect(lowShelf);
        lowShelf.connect(gain);
        gain.connect(ctx.destination);

        source.start(now);

        source.stop(
            now + duration
        );
    },

    tick(time, delta) {
        const moving =
            this.keys.KeyW ||
            this.keys.KeyA ||
            this.keys.KeyS ||
            this.keys.KeyD;

        if (!moving) {
            this.stepTimer = 0;
            return;
        }

        this.stepTimer +=
            delta / 1000;

        if (
            this.stepTimer >=
            this.stepInterval
        ) {
            this.stepTimer = 0;
            this.playStep();
        }
    }
});

/* ================================
   HUD层级
================================ */
AFRAME.registerComponent('hud-layer', {
    tick() {
        this.el.object3D.traverse(obj => {
            obj.renderOrder = 900;

            if (obj.material) {
                obj.material.depthTest = false;
                obj.material.depthWrite = false;
            }
        });
    }
});

/* ================================
   纸张UI层级
================================ */
AFRAME.registerComponent('paper-hud', {
    tick() {
        const setLayer =
            (selector, order) => {

                const el =
                    document.querySelector(
                        selector
                    );

                if (!el) return;

                el.object3D.traverse(obj => {
                    obj.renderOrder = order;

                    if (obj.material) {
                        obj.material.depthTest = false;
                        obj.material.depthWrite = false;
                    }
                });
            };

        setLayer(
            '#paperView',
            1000
        );

        setLayer(
            '#paperText',
            1001
        );

        setLayer(
            '#closeHint',
            1002
        );
    }
});

/* ================================
   Hallway → Room2
================================ */
AFRAME.registerComponent('door-interaction', {
    init() {
        this.nearDoor = false;
        this.hasEntered = false;

        this.player =
            document.querySelector(
                '#player'
            );

        this.camera =
            document.querySelector(
                '#camera'
            );

        this.hallway =
            document.querySelector(
                '#hallway'
            );

        this.room2 =
            document.querySelector(
                '#room2'
            );

        this.spawn =
            document.querySelector(
                '#room2Spawn'
            );

        this.text =
            document.querySelector(
                '#enterText'
            );

        this.doorSound =
            document.querySelector(
                '#doorCreakSound'
            );

        window.addEventListener(
            'keydown',
            e => {
                if (
                    e.code !== 'KeyE' ||
                    e.repeat
                ) {
                    return;
                }

                if (
                    !this.nearDoor ||
                    this.hasEntered
                ) {
                    return;
                }

                this.enterRoom();
            }
        );
    },

    enterRoom() {
        this.hasEntered = true;
        this.nearDoor = false;

        if (this.doorSound) {
            this.doorSound.currentTime = 0;
            this.doorSound.volume = 0.75;

            this.doorSound
                .play()
                .catch(() => {});
        }

        this.text.setAttribute(
            'value',
            ''
        );

        this.text.setAttribute(
            'visible',
            false
        );

        this.hallway.setAttribute(
            'visible',
            false
        );

        this.room2.setAttribute(
            'visible',
            true
        );

        this.room2.object3D
            .updateMatrixWorld(true);

        const spawnPosition =
            new THREE.Vector3();

        this.spawn.object3D
            .getWorldPosition(
                spawnPosition
            );

        this.player.object3D
            .position
            .copy(
                spawnPosition
            );

        this.camera.object3D
            .position
            .set(
                0,
                1.6,
                0
            );

        const lookControls =
            this.camera
                .components[
                    'look-controls'
                ];

        if (lookControls) {
            lookControls
                .yawObject
                .rotation
                .y =
                THREE.MathUtils
                    .degToRad(
                        ROOM2_YAW
                    );

            lookControls
                .pitchObject
                .rotation
                .x = 0;
        }
    },

    tick() {
        if (this.hasEntered) return;

        const doorPosition =
            new THREE.Vector3();

        const cameraPosition =
            new THREE.Vector3();

        this.el.object3D
            .getWorldPosition(
                doorPosition
            );

        this.camera.object3D
            .getWorldPosition(
                cameraPosition
            );

        const distance =
            doorPosition
                .distanceTo(
                    cameraPosition
                );

        const near =
            distance < 2;

        if (
            near !==
            this.nearDoor
        ) {
            this.nearDoor = near;

            this.text.setAttribute(
                'value',
                near
                    ? 'Press E to enter'
                    : ''
            );

            this.text.setAttribute(
                'visible',
                near
            );
        }
    }
});

/* ================================
   任务纸系统
================================ */
AFRAME.registerComponent('paper-system', {
    init() {
        this.hasPaper = false;
        this.inspecting = false;
        this.nearPaper = false;
        this.audioContext = null;

        this.paper =
            document.querySelector(
                '#missionPaper'
            );

        this.camera =
            document.querySelector(
                '#camera'
            );

        this.hint =
            document.querySelector(
                '#paperHint'
            );

        this.paperUI =
            document.querySelector(
                '#paperInspectUI'
            );

        this.subTask =
            document.querySelector(
                '#subTask'
            );

        window.addEventListener(
            'keydown',
            e => {
                if (
                    e.code !== 'KeyE' ||
                    e.repeat
                ) {
                    return;
                }

                if (
                    !this.hasPaper &&
                    this.nearPaper
                ) {
                    this.playPaperSound();

                    this.hasPaper = true;
                    this.inspecting = true;

                    this.paper.setAttribute(
                        'visible',
                        false
                    );

                    this.paperUI.setAttribute(
                        'visible',
                        true
                    );

                    this.subTask.setAttribute(
                        'visible',
                        true
                    );

                    this.hint.setAttribute(
                        'value',
                        ''
                    );

                    return;
                }

                if (
                    this.hasPaper &&
                    this.inspecting
                ) {
                    this.inspecting = false;

                    this.paperUI.setAttribute(
                        'visible',
                        false
                    );
                }
            }
        );
    },

    playPaperSound() {
        if (!this.audioContext) {
            this.audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }

        const ctx =
            this.audioContext;

        if (
            ctx.state ===
            'suspended'
        ) {
            ctx.resume();
        }

        const now =
            ctx.currentTime;

        const duration =
            0.42;

        const bufferSize =
            Math.floor(
                ctx.sampleRate *
                duration
            );

        const buffer =
            ctx.createBuffer(
                1,
                bufferSize,
                ctx.sampleRate
            );

        const data =
            buffer.getChannelData(0);

        for (
            let i = 0;
            i < bufferSize;
            i++
        ) {
            const t =
                i / bufferSize;

            const envelope =
                Math.sin(
                    Math.PI * t
                );

            const texture =
                0.65 +
                Math.random() *
                0.35;

            data[i] =
                (Math.random() * 2 - 1) *
                envelope *
                texture;
        }

        const source =
            ctx.createBufferSource();

        const highpass =
            ctx.createBiquadFilter();

        const lowpass =
            ctx.createBiquadFilter();

        const gain =
            ctx.createGain();

        source.buffer =
            buffer;

        highpass.type =
            'highpass';

        highpass.frequency.value =
            750;

        lowpass.type =
            'lowpass';

        lowpass.frequency.value =
            4800;

        gain.gain.setValueAtTime(
            0.001,
            now
        );

        gain.gain.linearRampToValueAtTime(
            0.42,
            now + 0.035
        );

        gain.gain.linearRampToValueAtTime(
            0.25,
            now + 0.18
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + duration
        );

        source.connect(
            highpass
        );

        highpass.connect(
            lowpass
        );

        lowpass.connect(
            gain
        );

        gain.connect(
            ctx.destination
        );

        source.start(now);

        source.stop(
            now + duration
        );
    },

    tick() {
        if (this.hasPaper) return;

        const paperPosition =
            new THREE.Vector3();

        const cameraPosition =
            new THREE.Vector3();

        this.paper.object3D
            .getWorldPosition(
                paperPosition
            );

        this.camera.object3D
            .getWorldPosition(
                cameraPosition
            );

        const near =
            paperPosition
                .distanceTo(
                    cameraPosition
                ) < 1.5;

        if (
            near !==
            this.nearPaper
        ) {
            this.nearPaper = near;

            this.hint.setAttribute(
                'value',
                near
                    ? 'Press E to pick up'
                    : ''
            );
        }
    }
});
</script>
</head>

    <a-box
        position="0.1 1 -5"
        width="0.2"
        height="6"
        depth="6"
        color="#000000">
    </a-box>

    <a-box
        position="5 0 -5"
        width="1"
        height="7"
        depth="4"
        color="#000000">
    </a-box>

    <!-- 玩家 -->
    <a-entity
        id="player"
        position="1 -1.5 5"
        paper-system
        footsteps>

        <a-camera
            id="camera"
            wasd-controls="acceleration: 6"
            look-controls
            head-bob>

            <!-- 黑屏层 -->
            <a-plane
                id="blackScreen"
                position="0 0 -0.5"
                width="20"
                height="20"
                visible="false"
                material="
                    shader: flat;
                    color: #000000;
                    side: double;
                    depthTest: false;
                    depthWrite: false">
            </a-plane>

            <!-- 环境光 -->
            <a-entity
                light="
                    type: ambient;
                    color: black;
                    intensity: 1.2">
            </a-entity>

            <!-- 手电 -->
            <a-entity
                id="flashlight"
                position="0 0 0"
                light="
                    type: spot;
                    color: #fff1d6;
                    intensity: 3;
                    distance: 18;
                    angle: 45;
                    penumbra: 1;
                    decay: 1">
            </a-entity>

            <!-- 白色小点准星 -->
            <a-circle
                id="crosshair"
                position="0 0 -0.6"
                radius="0.006"
                color="#ffffff"
                material="
                    shader: flat;
                    depthTest: false;
                    depthWrite: false">
            </a-circle>

            <!-- 任务UI -->
            <a-entity
                id="taskUI"
                position="-1.25 0.78 -1"
                hud-layer>

                <a-plane
                    position="0.20 -0.105 -0.01"
                    width="0.62"
                    height="0.27"
                    material="
                        color: #050505;
                        opacity: 0.72;
                        transparent: true;
                        shader: flat;
                        depthTest: false;
                        depthWrite: false">
                </a-plane>

                <a-plane
                    position="-0.105 -0.105 0"
                    width="0.008"
                    height="0.27"
                    material="
                        color: #651919;
                        shader: flat;
                        depthTest: false;
                        depthWrite: false">
                </a-plane>

                <a-text
                    value="MAIN TASK"
                    position="-0.075 -0.025 0.01"
                    align="left"
                    anchor="left"
                    width="0.52"
                    color="#8c3d3d"
                    material="
                        shader: flat;
                        depthTest: false;
                        depthWrite: false">
                </a-text>

                <a-text
                    value="ESCAPE FROM HERE"
                    position="-0.075 -0.075 0.01"
                    align="left"
                    anchor="left"
                    width="0.65"
                    color="#d8d4ca"
                    material="
                        shader: flat;
                        depthTest: false;
                        depthWrite: false">
                </a-text>

                <a-plane
                    position="0.19 -0.115 0"
                    width="0.52"
                    height="0.002"
                    material="
                        color: #4a4641;
                        opacity: 0.65;
                        transparent: true;
                        shader: flat;
                        depthTest: false;
                        depthWrite: false">
                </a-plane>

                <a-entity
                    id="subTask"
                    visible="false">

                    <a-text
                        value="OBJECTIVE UPDATED"
                        position="-0.075 -0.15 0.01"
                        align="left"
                        anchor="left"
                        width="0.46"
                        color="#77736c"
                        material="
                            shader: flat;
                            depthTest: false;
                            depthWrite: false">
                    </a-text>

                    <a-text
                        value="Explore the rooms"
                        position="-0.075 -0.20 0.01"
                        align="left"
                        anchor="left"
                        width="0.60"
                        color="#c9c5ba"
                        material="
                            shader: flat;
                            depthTest: false;
                            depthWrite: false">
                    </a-text>
                </a-entity>
            </a-entity>

            <!-- 纸张阅读UI -->
            <a-entity
                id="paperInspectUI"
                visible="false"
                paper-hud>

                <a-plane
                    id="paperView"
                    position="0 0 -0.70"
                    width="0.75"
                    height="1"
                    color="#b8aa87"
                    material="
                        shader: flat;
                        depthTest: false;
                        depthWrite: false">
                </a-plane>

                <a-text
                    id="paperText"
                    value="ROOM CHECK&#10;&#10;GO TO:&#10;&#10;504&#10;506&#10;507&#10;&#10;Check each room.&#10;Do not skip any doors."
                    position="0 0 -0.69"
                    align="center"
                    anchor="center"
                    baseline="center"
                    width="0.62"
                    color="#111111"
                    material="
                        shader: flat;
                        depthTest: false;
                        depthWrite: false">
                </a-text>

                <a-text
                    id="closeHint"
                    value="Press E to close"
                    position="0 -0.42 -0.68"
                    align="center"
                    anchor="center"
                    width="1"
                    color="#ffffff"
                    material="
                        shader: flat;
                        depthTest: false;
                        depthWrite: false">
                </a-text>
            </a-entity>

            <!-- 捡纸提示 -->
            <a-text
                id="paperHint"
                value=""
                position="0 -0.42 -0.60"
                align="center"
                anchor="center"
                width="1.5"
                color="#ffffff"
                material="
                    shader: flat;
                    depthTest: false">
            </a-text>

            <!-- 门提示 -->
            <a-text
                id="enterText"
                value=""
                position="0 -0.25 -0.60"
                align="center"
                anchor="center"
                width="2"
                color="#ffffff"
                material="
                    shader: flat;
                    depthTest: false;
                    depthWrite: false"
                visible="false">
            </a-text>

        </a-camera>

    </a-entity>

</a-scene>

</body>
</html>
