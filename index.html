<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elsewhere</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script>
const ROOM2_YAW=0;
let room2Visited=false;
let room2Completed=false;
let room3Entered=false;
let paperPickedUp=false;
// 走路起伏
AFRAME.registerComponent('head-bob',{
    init(){
        this.time=0;
        this.offset=0;
        this.keys={};
        window.addEventListener('keydown',e=>this.keys[e.code]=true);
        window.addEventListener('keyup',e=>this.keys[e.code]=false);
    },
    tick(time,delta){
        const moving=this.keys.KeyW||this.keys.KeyA||this.keys.KeyS||this.keys.KeyD;
        this.el.object3D.position.y-=this.offset;
        if(moving){
            this.time+=delta/1000;
            this.offset=Math.sin(this.time*10)*0.04;
        }else{
            this.offset*=0.8;
        }
        this.el.object3D.position.y+=this.offset;
    }
});
// Room2手电闪烁
AFRAME.registerComponent('room2-flicker',{
    init(){
        this.room2=document.querySelector('#room2');
        this.flashlight=document.querySelector('#flashlight');
        this.eyeRipple=document.querySelector('#eyeRipple');
        this.started=false;
        this.active=false;
        this.startTime=0;
        this.duration=5000;
        this.lastFlicker=0;
        this.nextFlickerDelay=80;
    },
    tick(time){
        if(!this.room2||!this.flashlight)return;
        if(!this.started&&this.room2.getAttribute('visible')){
            this.started=true;
            this.active=true;
            this.startTime=time;
            if(this.eyeRipple)this.eyeRipple.setAttribute('visible',true);
        }
        if(!this.active)return;
        if(time-this.startTime>=this.duration){
            this.active=false;
            const light=this.flashlight.getObject3D('light');
            if(light)light.intensity=3;
            this.flashlight.setAttribute('light','intensity',3);
            return;
        }
        if(time-this.lastFlicker>=this.nextFlickerDelay){
            this.lastFlicker=time;
            const random=Math.random();
            let intensity;
            if(random<0.25)intensity=0;
            else if(random<0.5)intensity=0.1+Math.random()*0.3;
            else if(random<0.7)intensity=0.7+Math.random()*0.8;
            else intensity=2.5+Math.random()*0.5;
            const light=this.flashlight.getObject3D('light');
            if(light)light.intensity=intensity;
            this.flashlight.setAttribute('light','intensity',intensity);
            this.nextFlickerDelay=50+Math.random()*150;
        }
    }
});
// 眼睛水波纹
AFRAME.registerComponent('eye-ripple',{
    init(){
        this.ring1=this.el.querySelector('#eyeRipple1');
        this.ring2=this.el.querySelector('#eyeRipple2');
        this.ring3=this.el.querySelector('#eyeRipple3');
    },
    tick(time){
        if(!this.el.getAttribute('visible'))return;
        this.animateRing(this.ring1,time,0);
        this.animateRing(this.ring2,time,500);
        this.animateRing(this.ring3,time,1000);
    },
    animateRing(ring,time,delay){
        if(!ring)return;
        const duration=1600;
        const cycle=((time-delay)%duration+duration)%duration;
        const progress=cycle/duration;
        const scale=0.35+progress*1.4;
        const opacity=(1-progress)*0.8;
        ring.object3D.scale.set(scale,scale,scale);
        const material=ring.getObject3D('mesh')?.material;
        if(material){
            material.opacity=opacity;
            material.transparent=true;
        }
    }
});
// 门标记朝向玩家
AFRAME.registerComponent('face-camera',{
    init(){
        this.camera=document.querySelector('#camera');
        this.cameraPosition=new THREE.Vector3();
    },
    tick(){
        if(!this.camera)return;
        this.camera.object3D.getWorldPosition(this.cameraPosition);
        this.el.object3D.lookAt(this.cameraPosition);
    }
});
// 门口红色引导
AFRAME.registerComponent('door-marker',{
    schema:{room:{type:'string',default:'room2'}},
    init(){
        this.time=0;
        this.baseY=this.el.object3D.position.y;
        this.hallway=document.querySelector('#hallway');
    },
    tick(time,delta){
        const hallwayVisible=this.hallway&&this.hallway.getAttribute('visible');
        let shouldShow=false;
        if(this.data.room==='room2'){
            shouldShow=hallwayVisible&&paperPickedUp&&!room2Visited;
        }else if(this.data.room==='room3'){
            shouldShow=hallwayVisible&&room2Completed&&!room3Entered;
        }
        this.el.object3D.visible=shouldShow;
        if(!shouldShow)return;
        this.time+=delta/1000;
        this.el.object3D.position.y=this.baseY+Math.sin(this.time*2.5)*0.08;
        const scale=1+Math.sin(this.time*3)*0.12;
        this.el.object3D.scale.set(scale,scale,scale);
    }
});
// Room2点击5次返回Hallway
AFRAME.registerComponent('eye-click-return',{
    init(){
        this.clickCount=0;
        this.requiredClicks=5;
        this.finished=false;
        this.room2=document.querySelector('#room2');
        this.hallway=document.querySelector('#hallway');
        this.player=document.querySelector('#player');
        this.camera=document.querySelector('#camera');
        this.eyeRipple=document.querySelector('#eyeRipple');
        this.blackScreen=document.querySelector('#blackScreen');
        window.addEventListener('mousedown',e=>{
            if(e.button!==0)return;
            this.handleClick();
        });
    },
    handleClick(){
        if(this.finished)return;
        if(!this.room2||!this.room2.getAttribute('visible'))return;
        if(!this.eyeRipple||!this.eyeRipple.getAttribute('visible'))return;
        this.clickCount++;
        this.eyeRipple.object3D.scale.set(1.25,1.25,1.25);
        setTimeout(()=>{
            if(this.eyeRipple)this.eyeRipple.object3D.scale.set(1,1,1);
        },80);
        if(this.clickCount>=this.requiredClicks){
            this.finished=true;
            this.startFadeOut();
        }
    },
    startFadeOut(){
        if(this.eyeRipple)this.eyeRipple.setAttribute('visible',false);
        if(!this.blackScreen)return;
        this.blackScreen.setAttribute('visible',true);
        this.blackScreen.setAttribute('material','opacity',0);
        this.blackScreen.object3D.traverse(obj=>{
            obj.renderOrder=99999;
            if(obj.material){
                obj.material.depthTest=false;
                obj.material.depthWrite=false;
                obj.material.transparent=true;
            }
        });
        const duration=1800;
        const startTime=performance.now();
        const fade=now=>{
            const progress=Math.min((now-startTime)/duration,1);
            const eased=progress*progress*(3-2*progress);
            this.blackScreen.setAttribute('material','opacity',eased);
            if(progress<1){
                requestAnimationFrame(fade);
            }else{
                setTimeout(()=>this.returnToHallway(),1500);
            }
        };
        requestAnimationFrame(fade);
    },
    returnToHallway(){
    const whisperingSound=document.querySelector('#whisperingSound');

    // 离开Room2时停止耳语
    if(whisperingSound){
        whisperingSound.pause();
        whisperingSound.currentTime=0;
    }
    this.room2.setAttribute('visible',false);
    this.hallway.setAttribute('visible',true);
    room2Completed=true;
    this.player.object3D.position.set(1,-1.5,5);
    this.camera.object3D.position.set(0,1.6,0);
    const lookControls=this.camera.components['look-controls'];
    if(lookControls){
        lookControls.yawObject.rotation.y=0;
        lookControls.pitchObject.rotation.x=0;
    }
    this.player.object3D.updateMatrixWorld(true);
    this.camera.object3D.updateMatrixWorld(true);
    setTimeout(()=>this.startFadeIn(),500);
},
    startFadeIn(){
        if(!this.blackScreen)return;
        const duration=2200;
        const startTime=performance.now();
        const fade=now=>{
            const progress=Math.min((now-startTime)/duration,1);
            const eased=progress*progress*(3-2*progress);
            this.blackScreen.setAttribute('material','opacity',1-eased);
            if(progress<1){
                requestAnimationFrame(fade);
            }else{
                this.blackScreen.setAttribute('material','opacity',0);
                this.blackScreen.setAttribute('visible',false);
            }
        };
        requestAnimationFrame(fade);
    }
});
// 脚步声
AFRAME.registerComponent('footsteps',{
    init(){
        this.keys={};
        this.stepTimer=0;
        this.stepInterval=0.58;
        this.audioContext=null;
        window.addEventListener('keydown',e=>{
            if(!['KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;
            this.keys[e.code]=true;
            if(!this.audioContext){
                this.audioContext=new(window.AudioContext||window.webkitAudioContext)();
            }
            if(this.audioContext.state==='suspended'){
                this.audioContext.resume();
            }
        });
        window.addEventListener('keyup',e=>{
            if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){
                this.keys[e.code]=false;
            }
        });
    },
    playStep(){
        if(!this.audioContext)return;
        const ctx=this.audioContext;
        const now=ctx.currentTime;
        const duration=0.18;
        const bufferSize=Math.floor(ctx.sampleRate*duration);
        const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
        const data=buffer.getChannelData(0);
        for(let i=0;i<bufferSize;i++){
            const fade=Math.pow(1-i/bufferSize,3);
            data[i]=(Math.random()*2-1)*fade;
        }
        const source=ctx.createBufferSource();
        const lowpass=ctx.createBiquadFilter();
        const bass=ctx.createBiquadFilter();
        const lowShelf=ctx.createBiquadFilter();
        const gain=ctx.createGain();
        source.buffer=buffer;
        lowpass.type='lowpass';
        lowpass.frequency.value=260+Math.random()*90;
        lowpass.Q.value=0.8;
        bass.type='peaking';
        bass.frequency.value=90+Math.random()*20;
        bass.Q.value=1.2;
        bass.gain.value=11;
        lowShelf.type='lowshelf';
        lowShelf.frequency.value=180;
        lowShelf.gain.value=8;
        const volume=0.65+Math.random()*0.025;
        gain.gain.setValueAtTime(0.001,now);
        gain.gain.linearRampToValueAtTime(volume,now+0.012);
        gain.gain.exponentialRampToValueAtTime(0.001,now+duration);
        source.connect(lowpass);
        lowpass.connect(bass);
        bass.connect(lowShelf);
        lowShelf.connect(gain);
        gain.connect(ctx.destination);
        source.start(now);
        source.stop(now+duration);
    },
    tick(time,delta){
        const moving=this.keys.KeyW||this.keys.KeyA||this.keys.KeyS||this.keys.KeyD;
        if(!moving){
            this.stepTimer=0;
            return;
        }
        this.stepTimer+=delta/1000;
        if(this.stepTimer>=this.stepInterval){
            this.stepTimer=0;
            this.playStep();
        }
    }
});
// HUD层级
AFRAME.registerComponent('hud-layer',{
    tick(){
        this.el.object3D.traverse(obj=>{
            obj.renderOrder=900;
            if(obj.material){
                obj.material.depthTest=false;
                obj.material.depthWrite=false;
            }
        });
    }
});
// 任务纸UI层级
AFRAME.registerComponent('paper-hud',{
    tick(){
        const setLayer=(selector,order)=>{
            const el=document.querySelector(selector);
            if(!el)return;
            el.object3D.traverse(obj=>{
                obj.renderOrder=order;
                if(obj.material){
                    obj.material.depthTest=false;
                    obj.material.depthWrite=false;
                }
            });
        };
        setLayer('#paperView',1000);
        setLayer('#paperText',1001);
        setLayer('#closeHint',1002);
    }
});
// Hallway进入Room2
AFRAME.registerComponent('door-interaction',{
    init(){
        this.nearDoor=false;
        this.hasEntered=false;
        this.player=document.querySelector('#player');
        this.camera=document.querySelector('#camera');
        this.hallway=document.querySelector('#hallway');
        this.room2=document.querySelector('#room2');
        this.spawn=document.querySelector('#room2Spawn');
        this.text=document.querySelector('#enterText');
        this.doorSound=document.querySelector('#room2DoorSound');
        this.whisperingSound=document.querySelector('#whisperingSound');

        window.addEventListener('keydown',e=>{
            if(e.code!=='KeyE'||e.repeat)return;
            if(!this.nearDoor||this.hasEntered)return;
            this.enterRoom();
        });
    },

    enterRoom(){
        this.hasEntered=true;
        this.nearDoor=false;
        room2Visited=true;

        if(this.doorSound){
            this.doorSound.pause();
            this.doorSound.currentTime=0;
            this.doorSound.volume=0.75;
            this.doorSound.play().catch(error=>{
                console.error('Room2 sound failed:',error);
            });
        }

        this.text.setAttribute('value','');
        this.text.setAttribute('visible',false);

        this.hallway.setAttribute('visible',false);
        this.room2.setAttribute('visible',true);

        // 进入Room2后开始播放耳语
        if(this.whisperingSound){
            this.whisperingSound.pause();
            this.whisperingSound.currentTime=0;
            this.whisperingSound.volume=0.45;
            this.whisperingSound.play().catch(error=>{
                console.error('Whispering sound failed:',error);
            });
        }
        this.room2.object3D.updateMatrixWorld(true);
        const spawnPosition=new THREE.Vector3();
        this.spawn.object3D.getWorldPosition(spawnPosition);
        this.player.object3D.position.copy(spawnPosition);
        this.camera.object3D.position.set(0,1.6,0);
        const lookControls=this.camera.components['look-controls'];

        if(lookControls){
            lookControls.yawObject.rotation.y=THREE.MathUtils.degToRad(ROOM2_YAW);
            lookControls.pitchObject.rotation.x=0;
        }
        this.player.object3D.updateMatrixWorld(true);
        this.camera.object3D.updateMatrixWorld(true);
    },

    tick(){
        if(this.hasEntered)return;
        const doorPosition=new THREE.Vector3();
        const cameraPosition=new THREE.Vector3();
        this.el.object3D.getWorldPosition(doorPosition);
        this.camera.object3D.getWorldPosition(cameraPosition);
        const near=doorPosition.distanceTo(cameraPosition)<2;
        if(near!==this.nearDoor){
            this.nearDoor=near;
            this.text.setAttribute('value',near?'Press E to enter':'');
            this.text.setAttribute('visible',near);
        }
    }
});
// Hallway进入Room3
AFRAME.registerComponent('room3-door-interaction',{
    init(){
        this.nearDoor=false;
        this.player=document.querySelector('#player');
        this.camera=document.querySelector('#camera');
        this.hallway=document.querySelector('#hallway');
        this.room3=document.querySelector('#room3');
        this.spawn=document.querySelector('#room3Spawn');
        this.text=document.querySelector('#enterText');
        this.doorSound=document.querySelector('#room3DoorSound');
        window.addEventListener('keydown',e=>{
            if(e.code!=='KeyE'||e.repeat)return;
            if(!room2Completed||!this.nearDoor||room3Entered)return;
            this.enterRoom();
        });
    },
    enterRoom(){
        room3Entered=true;
        this.nearDoor=false;
        this.text.setAttribute('value','');
        this.text.setAttribute('visible',false);
        if(this.doorSound){
            this.doorSound.pause();
            this.doorSound.currentTime=0;
            this.doorSound.volume=0.75;
            this.doorSound.play().catch(error=>{
                console.error('Room3 sound failed:',error);
            });
        }
        this.hallway.setAttribute('visible',false);
        this.room3.setAttribute('visible',true);
        this.room3.object3D.updateMatrixWorld(true);
        const spawnPosition=new THREE.Vector3();
        this.spawn.object3D.getWorldPosition(spawnPosition);
        this.player.object3D.position.copy(spawnPosition);
        this.camera.object3D.position.set(0,1.6,0);
        const lookControls=this.camera.components['look-controls'];
        if(lookControls){
            lookControls.yawObject.rotation.y=0;
            lookControls.pitchObject.rotation.x=0;
        }
        this.player.object3D.updateMatrixWorld(true);
        this.camera.object3D.updateMatrixWorld(true);
    },
    tick(){
        if(!room2Completed||room3Entered){
            this.nearDoor=false;
            return;
        }
        if(!this.hallway.getAttribute('visible')){
            if(this.nearDoor){
                this.nearDoor=false;
                this.text.setAttribute('value','');
                this.text.setAttribute('visible',false);
            }
            return;
        }
        const doorPosition=new THREE.Vector3();
        const cameraPosition=new THREE.Vector3();
        this.el.object3D.getWorldPosition(doorPosition);
        this.camera.object3D.getWorldPosition(cameraPosition);
        const near=doorPosition.distanceTo(cameraPosition)<2;
        if(near!==this.nearDoor){
            this.nearDoor=near;
            this.text.setAttribute('value',near?'Press E to enter':'');
            this.text.setAttribute('visible',near);
        }
    }
});
// Room3黑色盒子
AFRAME.registerComponent('black-box-interaction',{
    init(){
        this.nearBox=false;
        this.pickedUp=false;
        this.player=document.querySelector('#player');
        this.camera=document.querySelector('#camera');
        this.hallway=document.querySelector('#hallway');
        this.room3=document.querySelector('#room3');
        this.text=document.querySelector('#enterText');
        this.blackScreen=document.querySelector('#blackScreen');
        window.addEventListener('keydown',e=>{
            if(e.code!=='KeyE'||e.repeat)return;
            if(!this.nearBox||this.pickedUp)return;
            this.pickUp();
        });
    },
    pickUp(){
        this.pickedUp=true;
        this.nearBox=false;
        this.text.setAttribute('value','');
        this.text.setAttribute('visible',false);
        this.el.setAttribute('visible',false);
        this.fadeOut();
    },
    fadeOut(){
        if(!this.blackScreen)return;
        this.blackScreen.setAttribute('visible',true);
        this.blackScreen.setAttribute('material','opacity',0);
        this.blackScreen.object3D.traverse(obj=>{
            obj.renderOrder=99999;
            if(obj.material){
                obj.material.depthTest=false;
                obj.material.depthWrite=false;
                obj.material.transparent=true;
            }
        });
        const duration=1800;
        const startTime=performance.now();
        const fade=now=>{
            const progress=Math.min((now-startTime)/duration,1);
            const eased=progress*progress*(3-2*progress);
            this.blackScreen.setAttribute('material','opacity',eased);
            if(progress<1){
                requestAnimationFrame(fade);
            }else{
                setTimeout(()=>this.returnToHallway(),700);
            }
        };
        requestAnimationFrame(fade);
    },
    returnToHallway(){
        this.room3.setAttribute('visible',false);
        this.hallway.setAttribute('visible',true);
        this.player.object3D.position.set(1,-1.5,5);
        this.camera.object3D.position.set(0,1.6,0);
        const lookControls=this.camera.components['look-controls'];
        if(lookControls){
            lookControls.yawObject.rotation.y=0;
            lookControls.pitchObject.rotation.x=0;
        }
        this.player.object3D.updateMatrixWorld(true);
        this.camera.object3D.updateMatrixWorld(true);
        setTimeout(()=>this.fadeIn(),500);
    },
    fadeIn(){
        if(!this.blackScreen)return;
        const duration=2200;
        const startTime=performance.now();
        const fade=now=>{
            const progress=Math.min((now-startTime)/duration,1);
            const eased=progress*progress*(3-2*progress);
            this.blackScreen.setAttribute('material','opacity',1-eased);
            if(progress<1){
                requestAnimationFrame(fade);
            }else{
                this.blackScreen.setAttribute('material','opacity',0);
                this.blackScreen.setAttribute('visible',false);
            }
        };
        requestAnimationFrame(fade);
    },
    tick(){
        if(this.pickedUp)return;
        if(!this.room3||!this.room3.getAttribute('visible'))return;
        const boxPosition=new THREE.Vector3();
        const cameraPosition=new THREE.Vector3();
        this.el.object3D.getWorldPosition(boxPosition);
        this.camera.object3D.getWorldPosition(cameraPosition);
        const near=boxPosition.distanceTo(cameraPosition)<1.7;
        if(near!==this.nearBox){
            this.nearBox=near;
            this.text.setAttribute('value',near?'Press E to pick up':'');
            this.text.setAttribute('visible',near);
        }
    }
});
// 开场语音和字幕
AFRAME.registerComponent('opening-narration',{
    init(){
        this.audio=document.querySelector('#beginAudio');
        this.subtitleBox=document.querySelector('#openingSubtitle');
        this.subtitleText=document.querySelector('#openingSubtitleText');
        this.started=false;
        this.subtitleIndex=-1;
        this.subtitles=[
            {start:0,end:2,text:'Welcome, Dream Explorer.'},
            {start:2,end:9,text:'Congratulations! You have been selected to participate in the Elsewhere Dream Exploration Program.'},
            {start:9,end:13,text:'Dreams are one of the most important windows into the human mind.'},
            {start:13,end:23,text:'Every hallway, every room, and every object you encounter may be a reflection of memory, emotion, or the subconscious.'},
            {start:23,end:26,text:'As a Dream Explorer, your responsibility is simple.'},
            {start:26,end:32,text:'Observe the environment, document anything unusual, and follow the instructions provided to you.'},
            {start:32,end:36,text:'Please remember: everything you see here is part of a dream.'},
            {start:36,end:38,text:'Therefore, nothing here can hurt you.'},
            {start:38,end:41,text:"At least, that's what we've been told."},
            {start:41,end:44,text:'Your first assignment has already begun.'},
            {start:44,end:47,text:'Somewhere in this environment is a way out.'},
            {start:47,end:49,text:'Your task is simple.'},
            {start:49,end:51,text:'Escape from here.'}
        ];
        if(this.audio){
            this.audio.addEventListener('ended',()=>{
                this.subtitleText.setAttribute('value','');
                this.subtitleBox.setAttribute('visible',false);
            });
        }
        const start=()=>{
            if(this.started)return;
            this.startNarration();
        };
        window.addEventListener('click',start);
        window.addEventListener('keydown',start);
        this.startNarration();
    },

    startNarration(){
        if(this.started||!this.audio)return;
        this.audio.volume=0.9;
        const playPromise=this.audio.play();
        if(playPromise!==undefined){
            playPromise.then(()=>{
                this.started=true;
                this.subtitleBox.setAttribute('visible',true);
            }).catch(()=>{
                console.log('Click or press a key to start narration.');
            });
        }
    },

    tick(){
        if(!this.started||!this.audio||this.audio.paused)return;
        const currentTime=this.audio.currentTime;
        let activeIndex=-1;
        for(let i=0;i<this.subtitles.length;i++){
            const subtitle=this.subtitles[i];
            if(currentTime>=subtitle.start&&currentTime<subtitle.end){
                activeIndex=i;
                break;
            }
        }

        if(activeIndex===this.subtitleIndex)return;
        this.subtitleIndex=activeIndex;
        if(activeIndex===-1){
            this.subtitleText.setAttribute('value','');
            return;
        }
        this.subtitleText.setAttribute(
            'value',
            this.subtitles[activeIndex].text
        );
    }
});
// 任务纸系统
AFRAME.registerComponent('paper-system',{
    init(){
        this.hasPaper=false;
        this.inspecting=false;
        this.nearPaper=false;
        this.animating=false;
        this.audioContext=null;
        this.paper=document.querySelector('#missionPaper');
        this.camera=document.querySelector('#camera');
        this.hint=document.querySelector('#paperHint');
        this.paperUI=document.querySelector('#paperInspectUI');
        this.subTask=document.querySelector('#subTask');
        this.setPaperHiddenTransform();
        window.addEventListener('keydown',e=>{
            if(e.code!=='KeyF'||e.repeat)return;
            if(this.animating)return;
            if(!this.hasPaper&&this.nearPaper){
                this.pickUpPaper();
                return;
            }
            if(!this.hasPaper)return;
            if(this.inspecting)this.hidePaper();
            else this.showPaper();
        });
    },
    pickUpPaper(){
        this.hasPaper=true;
        this.inspecting=false;
        paperPickedUp=true;
        this.paper.setAttribute('visible',false);
        this.subTask.setAttribute('visible',true);
        this.hint.setAttribute('value','');
        this.showPaper();
    },
    showPaper(){
        if(this.animating)return;
        this.playPaperSound();
        this.animating=true;
        this.inspecting=true;
        this.paperUI.setAttribute('visible',true);
        const startPos=new THREE.Vector3(0.42,-0.50,0);
        const endPos=new THREE.Vector3(0,0,0);
        const startScale=0.42;
        const endScale=1;
        const startRotation=18;
        const endRotation=0;
        this.paperUI.object3D.position.copy(startPos);
        this.paperUI.object3D.scale.set(startScale,startScale,startScale);
        this.paperUI.object3D.rotation.z=THREE.MathUtils.degToRad(startRotation);
        const duration=350;
        const startTime=performance.now();
        const animate=now=>{
            const progress=Math.min((now-startTime)/duration,1);
            const eased=1-Math.pow(1-progress,3);
            this.paperUI.object3D.position.lerpVectors(startPos,endPos,eased);
            const scale=startScale+(endScale-startScale)*eased;
            this.paperUI.object3D.scale.set(scale,scale,scale);
            const rotation=startRotation+(endRotation-startRotation)*eased;
            this.paperUI.object3D.rotation.z=THREE.MathUtils.degToRad(rotation);
            if(progress<1){
                requestAnimationFrame(animate);
            }else{
                this.animating=false;
            }
        };
        requestAnimationFrame(animate);
    },
    hidePaper(){
        if(this.animating)return;
        this.animating=true;
        const startPos=new THREE.Vector3(0,0,0);
        const endPos=new THREE.Vector3(0.42,-0.50,0);
        const startScale=1;
        const endScale=0.42;
        const startRotation=0;
        const endRotation=18;
        const duration=250;
        const startTime=performance.now();
        const animate=now=>{
            const progress=Math.min((now-startTime)/duration,1);
            const eased=progress*progress*progress;
            this.paperUI.object3D.position.lerpVectors(startPos,endPos,eased);
            const scale=startScale+(endScale-startScale)*eased;
            this.paperUI.object3D.scale.set(scale,scale,scale);
            const rotation=startRotation+(endRotation-startRotation)*eased;
            this.paperUI.object3D.rotation.z=THREE.MathUtils.degToRad(rotation);
            if(progress<1){
                requestAnimationFrame(animate);
            }else{
                this.inspecting=false;
                this.animating=false;
                this.paperUI.setAttribute('visible',false);
                this.setPaperHiddenTransform();
            }
        };
        requestAnimationFrame(animate);
    },
    setPaperHiddenTransform(){
        if(!this.paperUI)return;
        this.paperUI.object3D.position.set(0.42,-0.50,0);
        this.paperUI.object3D.scale.set(0.42,0.42,0.42);
        this.paperUI.object3D.rotation.z=THREE.MathUtils.degToRad(18);
    },
    playPaperSound(){
        if(!this.audioContext){
            this.audioContext=new(window.AudioContext||window.webkitAudioContext)();
        }
        const ctx=this.audioContext;
        if(ctx.state==='suspended'){
            ctx.resume();
        }
        const now=ctx.currentTime;
        const duration=0.42;
        const bufferSize=Math.floor(ctx.sampleRate*duration);
        const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
        const data=buffer.getChannelData(0);
        for(let i=0;i<bufferSize;i++){
            const t=i/bufferSize;
            const envelope=Math.sin(Math.PI*t);
            const texture=0.65+Math.random()*0.35;
            data[i]=(Math.random()*2-1)*envelope*texture;
        }
        const source=ctx.createBufferSource();
        const highpass=ctx.createBiquadFilter();
        const lowpass=ctx.createBiquadFilter();
        const gain=ctx.createGain();
        source.buffer=buffer;
        highpass.type='highpass';
        highpass.frequency.value=750;
        lowpass.type='lowpass';
        lowpass.frequency.value=4800;
        gain.gain.setValueAtTime(0.001,now);
        gain.gain.linearRampToValueAtTime(0.42,now+0.035);
        gain.gain.linearRampToValueAtTime(0.25,now+0.18);
        gain.gain.exponentialRampToValueAtTime(0.001,now+duration);
        source.connect(highpass);
        highpass.connect(lowpass);
        lowpass.connect(gain);
        gain.connect(ctx.destination);
        source.start(now);
        source.stop(now+duration);
    },
    tick(){
        if(this.hasPaper)return;
        const paperPosition=new THREE.Vector3();
        const cameraPosition=new THREE.Vector3();
        this.paper.object3D.getWorldPosition(paperPosition);
        this.camera.object3D.getWorldPosition(cameraPosition);
        const near=paperPosition.distanceTo(cameraPosition)<1.5;
        if(near!==this.nearPaper){
            this.nearPaper=near;
            this.hint.setAttribute('value',near?'Press F to pick up':'');
        }
    }
});
</script>
