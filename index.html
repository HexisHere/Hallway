<html>
<head>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <!-- 走路起伏 -->
    <script>

    AFRAME.registerComponent('head-bob', {

        init: function () {

            this.time = 0; 
            this.keys = {};
            this.offset = 0;

            window.addEventListener('keydown', (e) => {
                this.keys[e.code] = true;
            });

            window.addEventListener('keyup', (e) => {
                this.keys[e.code] = false;
            });

        },

        tick: function (time, delta) {

            const moving =
                this.keys['KeyW'] ||
                this.keys['KeyA'] ||
                this.keys['KeyS'] ||
                this.keys['KeyD'];

            // 取消上一帧起伏
            this.el.object3D.position.y -= this.offset;


            if (moving) {

                this.time += delta / 1000;
                this.offset =
                    Math.sin(this.time * 10) * 0.04;

            } else {

                this.offset *= 0.8;

            }


            // 添加这一帧起伏
            this.el.object3D.position.y += this.offset;

        }

    });

    </script>

    <!-- ======================================== -->
    <!-- 红色区域交互 -->
    <!-- 第一次点击：显示 Enter? -->
    <!-- 第二次点击：进入 Room2 -->
    <!-- ======================================== -->

    <script>

    AFRAME.registerComponent('door-interaction', {

        init: function () {

            this.readyToEnter = false;

            this.el.addEventListener('click', () => {

                const text =
                    document.querySelector('#enterText');

                const hallway =
                    document.querySelector('#hallway');

                const room2 =
                    document.querySelector('#room2');

                const player =
                    document.querySelector('#player');


                // 第一次点击
                // 只显示 Enter?
                if (!this.readyToEnter) {

                    text.setAttribute('visible', true);

                    this.readyToEnter = true;

                    return;
                }


                // 第二次点击
                // 隐藏 Enter?
                text.setAttribute('visible', false);


                // 隐藏 Hallway
                hallway.setAttribute('visible', false);


                // 显示 Room2
                room2.setAttribute('visible', true);


                // 玩家传送到 Room2
                player.setAttribute(
                    'position',
                    '4 -1.5 -1'
                );


                console.log("Entered Room2");

            });

        }

    });

    </script>

    <!-- ======================================== -->
    <!-- 调整红色区域位置 -->
    <!-- ======================================== -->

    <script>

    AFRAME.registerComponent('move-trigger', {

        init: function () {

            window.addEventListener('keydown', (e) => {

                const p =
                    this.el.object3D.position;

                const step = 0.1;


                // 左右
                if (e.code === 'ArrowLeft')
                    p.x -= step;

                if (e.code === 'ArrowRight')
                    p.x += step;


                // 前后
                if (e.code === 'ArrowUp')
                    p.z -= step;

                if (e.code === 'ArrowDown')
                    p.z += step;


                // 上下
                if (e.code === 'KeyQ')
                    p.y += step;

                if (e.code === 'KeyE')
                    p.y -= step;


                console.log(
                    "Trigger Position:",
                    p.x.toFixed(2),
                    p.y.toFixed(2),
                    p.z.toFixed(2)
                );

            });

        }

    });

    </script>
</head>


<body>


<a-scene>


    <!-- ======================================== -->
    <!-- 模型资源 -->
    <!-- ======================================== -->

    <a-assets>


        <!-- Hallway -->
        <a-asset-item
            id="Hallway" src="Hallway.glb">
        </a-asset-item>


        <!-- Room2 -->
        <a-asset-item
            id="Room2" src="Room2.glb">
        </a-asset-item>


    </a-assets>

    <!-- Hallway -->
    <a-entity

        id="hallway"gltf-model="#Hallway"
        position="0 0 -5"
        rotation="0 0 0"
        scale="1 1 1"
        visible="true">

    </a-entity>


    <!-- Room2 -->
    <!-- 一开始隐藏 -->
    <a-entity
    id="room2"
    gltf-model="#Room2"
    position="5.5 0 -5"
    rotation="0 0 0"
    scale="1 1 1"
    visible="true"
    move-room>
</a-entity>

    <!-- 红色交互区域 -->
    <a-box

        id="doorTrigger"
        class="clickable"
        position="1.8 1 -2.3"
        width="0.5"
        height="4"
        depth="2"
        color="red"
        opacity="0.5"
        door-interaction>

    </a-box>

    <!-- 黑色墙体 -->
    <a-box
    position="5 0 -5"
    width="1"
    height="7"
    depth="4"
    color="black">
    
</a-box>

    <!-- 玩家 -->
    <a-entity

        id="player" position="1 -1.5 1">

        <a-camera
            id="camera"
            wasd-controls="acceleration: 6"
            look-controls
            head-bob>

            <!-- 中心准星 -->

            <a-cursor
                color="white"
                raycaster="objects: .clickable">
            </a-cursor>

            <!-- Enter 提示 -->

            <a-text

                id="enterText" value="Enter?"
                position="0 -0.25 -1" 
                align="center"
                width="2"
                color="white"
                visible="false">

            </a-text>

        </a-camera>

    </a-entity>
</a-scene>
</body>
</html>
