<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
AFRAME.registerComponent('head-bob', {

    init: function () {
        this.time = 0;
        this.keys = {};
        this.offset = 0;

        window.addEventListener('keydown', (e) => {
            this.keys[e.code] = true;
        });

        window.addEventListener('keyup', (e) => {
            this.keys[e.code] = false;
        });
    },

    tick: function (time, delta) {

        const moving =
            this.keys['KeyW'] ||
            this.keys['KeyA'] ||
            this.keys['KeyS'] ||
            this.keys['KeyD'];

        // 先取消上一帧的起伏
        this.el.object3D.position.y -= this.offset;

        if (moving) {

            this.time += delta / 1000;

            // 计算这一帧的上下起伏
            this.offset =
                Math.sin(this.time * 10) * 0.04;

        } else {

            this.offset *= 0.8;

        }

        // 加上新的起伏
        this.el.object3D.position.y += this.offset;
    }

});
</script>

  <script>
AFRAME.registerComponent('door-interaction', {

    init: function () {

        this.el.addEventListener('click', function () {

            const text = document.querySelector('#enterText');

            text.setAttribute('visible', 'true');

        });

    }

});
</script>

<script>
AFRAME.registerComponent('move-trigger', {
    init: function () {
        window.addEventListener('keydown', (e) => {

            const p = this.el.object3D.position;
            const step = 0.1;

            // 左右
            if (e.code === 'ArrowLeft')  p.x -= step;
            if (e.code === 'ArrowRight') p.x += step;

            // 前后
            if (e.code === 'ArrowUp')    p.z -= step;
            if (e.code === 'ArrowDown')  p.z += step;

            // 上下
            if (e.code === 'KeyQ') p.y += step;
            if (e.code === 'KeyE') p.y -= step;

            console.log(
                "Trigger Position:",
                p.x.toFixed(2),
                p.y.toFixed(2),
                p.z.toFixed(2)
            );
        });
    }
});
</script>
